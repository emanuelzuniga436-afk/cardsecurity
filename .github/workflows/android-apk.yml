name: Compilar APK GestionClientesApp

on:
  push:
    paths:
      - "GestionClientesApp/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GestionClientesApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestionClientesApp-apk
          path: GestionClientesApp/app/build/outputs/apk/debug/app-debug.apk
