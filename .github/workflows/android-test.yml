name: Probar APK en emulador

on:
  push:
    paths:
      - ".github/workflows/android-test.yml"
      - "GestionClientesApp/**"
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: GestionClientesApp
        run: ./gradlew assembleDebug --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en el emulador y leer errores
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r GestionClientesApp/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.gestionclientesapp/.MainActivity
            sleep 20
            adb shell pidof com.example.gestionclientesapp || echo "=== LA APP NO ESTA CORRIENDO (se cerro) ==="
            echo "=== LOGCAT ==="
            adb logcat -d | grep -iE "FATAL|AndroidRuntime|Exception|firebase|gestionclientes|Caused by|at com\.|at android" | tail -150 || true
